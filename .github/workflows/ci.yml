name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev,viz]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: mypy
        run: mypy

      - name: pytest (fast suite)
        run: pytest -m "not slow" --cov=options_risk --cov-report=term-missing

  slow-tests:
    # The long-running historical-study and hedging-simulation tests, split out
    # so the fast suite reports quickly. Together the two jobs run every test.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev,viz]"

      - name: pytest (slow suite)
        run: pytest -m slow --durations=15

  locked-env:
    # Installs the exact, fully resolved dependency set from requirements-lock.txt
    # (resolved for Python 3.12) so this job is reproducible regardless of new
    # upstream releases. The matrix jobs above deliberately keep using loose
    # ranges to catch upstream breakage.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from lock
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: pytest (fast suite, locked env)
        run: pytest -m "not slow"
