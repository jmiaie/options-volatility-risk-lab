[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-volatility-risk-lab"
version = "0.1.0"
description = "Lean research lab for derivatives pricing, hedging, and portfolio tail risk"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GitHub Copilot Coding Agent" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
packages = ["options_risk"]

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true
