[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-risk"
version = "0.1.0"
description = "Options, volatility, and portfolio risk research lab: BSM pricing, Greeks, implied volatility, Monte Carlo, delta hedging, VaR/ES, and stress testing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeffrey Milam" }]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
data = ["yfinance>=0.2.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# N (pep8-naming) is intentionally excluded: this codebase follows standard
# quant-finance math notation (S, K, T, r, q, sigma, d1, d2) rather than
# PEP8 variable-naming conventions, by design and throughout.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/options_risk"]
